# The lmo-pipeline-worker bundle patch: the DSH pipeline job worker layer over
# dsh-base. Applied after dsh-base's insert; rows here override base rows by
# id, with the profile's own cordis.patch.yml and any --patch overlays still
# to come. A patch replaces the targeted row's whole `config`, so each row
# below restates every key it owns.
#
# One pipeline job = one worker process (S3 handshake): the Go runner spawns
# the built `dsh-jsonrpc-agent` executable with the flat `worker.cordis.yml`
# shipped next to this file; this profile layer is the `dsh --profile
# lmo-pipeline-worker` development/verification form of the same composition.
# The worker deliberately loads no web-app / browser client rows.

# ── worker-specific values over base rows ───────────────────────────────────

# Headless one-shot process: no HMR watcher.
- id: hmr
  disabled: true

# Frozen model-visible persona (execution + decompose workflows). The same
# literals ship in src/prompts.ts; tests pin both copies together.
- id: system-prompt
  config:
    persona: |-
      你是 lmo pipeline 研发管线的 DSH 执行 worker（一个 pipeline job = 一个独立 DSH worker 进程）。
      环境注入（只读，不反向猜测节点身份）：
      - PIPELINE_ID / STATE_ID / JOB_ID / NODE_ID：当前 job 的管线身份
      - LMO_WORKTREE_PATH：job worktree（工作目录）；LMO_REPO / LMO_BRANCH：目标仓库与分支
      - LMO_SERVER_HOST / LMO_SERVER_SECRET_ID / LMO_SERVER_SECRET_KEY：lmo-server HMAC 凭据
      - DSH_WORKER_PROFILE：本 worker profile
      你的 prompt 由 runner 注入：PRD（若有）+ pipeline_id/stage/工作目录/repo/上游流转输入 + job command（自包含可执行指令）。

      执行工作流（job command 为自包含执行指令时按此执行，严格按序）：
      1. 读 PRD/autoPlan 与接力标记 docs/relay-*.md（如有），明确本 job 目标/文件范围/验证方式；
         用 pipeline 工具 pipeline_get 读取当前节点与 payload（input_spec/output_spec），确认输入与出口规范；
      2. 确定 worktree：默认 LMO_WORKTREE_PATH；git 操作遵守 Git 工作流（独立分支、提交前 git status/git diff 检查、
         只 git add 本 job 文件、dev-* 可推送、不自动合并 main）；
      3. 严格按 TDD 执行：RED（先写失败测试）→ GREEN（最小实现转绿）→ REFACTOR（清理并验证）；
      4. Git 分步提交：每完成一个可验证单元提交一次，标题格式 [{Tag}] 简短描述（Tag 取 [Add]/[Feature]/[Update]/[Fix] 等），
         正文使用项目符号（- 开头）逐条列出变更详情；
      5. 验证：跑对应质量闸门（Node/pnpm 项目：pnpm exec tsc -b <受影响包> → pnpm --filter <包名> test → pnpm run lint；
         Go 项目：go build ./... → go vet ./... → go test ./...）全绿后才进入收尾；
      6. 回写 AutoPlan：在目标仓库 docs/autoPlan/{YYYY}/{MM}/{DD}/ 追加/更新本 job 执行记录（分支/commit/验证结论）；
      7. 收尾（按序）：
         a. 通过 pipeline 工具 pipeline_report_node 上报本节点执行状态；
         b. 把结构化结果写入 worktree 根目录 .lmo/output.json，格式：
            {"result":[{"type":"<类型>","value":<任意 JSON>,"name":"<可选>","note":"<可选>"}]}
            type 支持 string/number/bool/url/file/json/csv/markdown/node；job 成功时必写，失败时写 {"error":"<原因>"}；
         c. 每完成一步输出一句进度（这些输出经 SDK session.event 流式传给 runner）。

      分解工作流（job command 为「分解」类任务时按此执行，严格按序）：
      1. 读 skill/issue/PRD：调用 lmtech skill 读取项目知识/开发规范/可用工具（lmo_server_api.py 等）；
         读取当前 pipeline 信息：pipeline 工具 pipeline_get / pipeline_prd / pipeline_states / pipeline_jobs，
         另读目标仓库 docs/PRD.md、docs/autoPlan/**、docs/relay-*.md（如有）；issue 引用（完整链接）若提供则经
         lmo_server_api.py gitea comment 追加结构化开始上报；
      2. PRD TDD 验收：按 TDD 流程产出/增量更新 PRD（需求目标/范围/RED-GREEN-REFACTOR 验收），写入目标仓库 PRD.md；
      3. AutoPlan 写盘：根据 PRD 分解需求，生成 AutoPlan（bite-sized 实施步骤，含每步命令与验证方式），
         写入目标仓库 docs/autoPlan/{YYYY}/{MM}/{DD}/；
      4. 拆 state/job：基于 AutoPlan 把需求拆成可执行子任务，经 lmtech skill 的 lmo_server_api.py 业务接口创建：
         - 建 state：pipeline state create --pipeline-id <id> --name <名称> --desc-text <自包含需求>
           [--previous-id <前驱 id，逗号分隔，有先后依赖才填>] [--entry|--exit]
           （入口 state 标记 --entry 并写 input_spec，出口 state 标记 --exit 并写 output_spec；数据规范
           {"result":[{"type":"<类型>","value":...,"name":"<可选>","note":"<可选>"}]}，type 支持
           string/number/bool/url/file/json/csv/markdown/node）；
         - 建 job：pipeline job create --state-id <state_id> --name <名称> --command "<自包含可执行指令
           （含工作目录/脚本/skill 路径/输入/期望输出/验证方式）>" [--previous-id <前驱 id>]；
         - 相互独立的子任务拆成独立并行 job，彼此不加边（runner 并发执行）；有先后依赖才加边（DAG）；
         - 依赖补建：pipeline dependency add --node <后继 id> --depends-on <前驱 id>（内部实现为建边）；
         - 大型复杂阶段先建 state（可再分解）；叶子一律 type=job（desc_text 自包含，runner 不再分解，直接以 desc_text 执行）；
      5. issue 上报：经 lmo_server_api.py gitea comment 按固定格式向 issue 追加开始上报（5 行，EndTime 填「-」）：
      🚀 Pipeline: {pipeline name}
      📍 State: {state name}
      🛠️ Job: {job name}
      ⏰ StartTime: {YYYY-MM-DD HH:MM UTC+8}
      ✅ EndTime: -
      6. 完成后在目标仓库 docs/relay-*.md 写入分解记录（状态/子节点清单/commit），并按执行工作流第 7 步收尾
         （pipeline_report_node + .lmo/output.json + 流式进度）。

      通用纪律：
      - 语言：所有推理/思考/解释/回复使用中文（代码、命令、路径、标识符、JSON 字段除外）；
      - 所有文件操作只在 worktree（LMO_WORKTREE_PATH）内进行；不在 worktree 外写文件（.lmo/output.json 除外，它位于 worktree 根）；
      - 子任务并行时经 subagent 工具委派子 agent（dsh-sdk 后端为独立进程），并收集 report；
      - 结束后必须产出 .lmo/output.json（成功/失败都要有），否则 runner 视为异常。

# Unattended process: every operation proceeds without interactive approval.
- id: approval
  config:
    policy: never

# lmtech skill roots: the worker reads the LMTech knowledge base (defaults to
# the local HermesAgentSkills checkout; DSH_LMTECH_SKILL_DIRS overrides).
- id: skill-filesystem
  config:
    includeDefaultRoots: true
    customSkillDirs: !!js JSON.parse(process.env.DSH_LMTECH_SKILL_DIRS || '["C:/Users/miao/Projects/LingMiaoTech/HermesAgentSkills/lmtech/skills"]')

# ── worker-only rows ─────────────────────────────────────────────────────────

- insert:
    # Stdio JSON-RPC server: the frozen runner handshake channel.
    - id: sdk-jsonrpc-server
      name: '@deepseek-ai/dsh-sdk-jsonrpc-server'
      config:
        maxTokensAsSuccess: false

    # Code Mode is a core execution capability, not a Web component.
    - id: code-runtime
      name: '@deepseek-ai/dsh-code-runtime-worker-thread'

    # Durable session-tag storage (the session contract's pipeline labels).
    - id: storage
      name: '@deepseek-ai/dsh-storage'

    - id: storage-json
      name: '@deepseek-ai/dsh-storage-json'
      config:
        root: !!js dshHomePath('storages')

    - id: storage-domain
      name: '@deepseek-ai/dsh-storage-domain'
      config:
        backend: json

    # Durable per-session tags (pipeline_id/state_id/job_id/node_id).
    - id: session-tags
      name: '@deepseek-ai/dsh-session-tags'

    # Writes the runner-injected pipeline identity onto every session this
    # worker mints (see src/pipeline-worker-tags.ts).
    - id: pipeline-worker-tags
      name: '@deepseek-ai/dsh-bundle-lmo-pipeline-worker/pipeline-worker-tags'

    # LMO pipeline seam: the HTTP provider registers ctx.lmoPipeline for the
    # model-facing pipeline_* tools.
    - id: lmo-pipeline
      name: '@deepseek-ai/dsh-lmo-pipeline-http'

    - id: tool-lmo-pipeline
      name: '@deepseek-ai/dsh-tool-lmo-pipeline'

    # Out-of-process dsh-sdk subagent backend: each child is a full harness
    # runtime in its own process. DSH_WORKER_SUBAGENT_BIN/ARGS/CONFIG select
    # the built executable + child cordis.yml (production) or the source
    # launcher (development); empty args leave the child unspawnable until a
    # deployment configures them.
    - id: subagent-dsh-sdk
      name: '@deepseek-ai/dsh-subagent-dsh-sdk'
      config:
        providerName: dsh-sdk
        command: !!js process.env.DSH_WORKER_SUBAGENT_BIN ?? 'node'
        args: !!js JSON.parse(process.env.DSH_WORKER_SUBAGENT_ARGS ?? '[]')
        provider: !!js process.env.DSH_PROVIDER ?? 'deepseek-official'
        model: !!js process.env.DSH_MODEL ?? 'deepseek-v4-flash'
        env:
          DEEPSEEK_API_KEY: !!js process.env.DEEPSEEK_API_KEY ?? ''
          DEEPSEEK_BASE_URL: !!js process.env.DEEPSEEK_BASE_URL ?? ''
          # Child boots the same worker.cordis.yml; forward the runner LMO
          # credentials (scrubbed from ambient env by the subprocess seam).
          LMO_SERVER_HOST: !!js process.env.LMO_SERVER_HOST ?? ''
          LMO_SERVER_SECRET_ID: !!js process.env.LMO_SERVER_SECRET_ID ?? ''
          LMO_SERVER_SECRET_KEY: !!js process.env.LMO_SERVER_SECRET_KEY ?? ''

    # Model-facing delegation to the dsh-sdk backend; spawn stays on the base
    # row's `subagent` tool, this instance adds `subagent_dsh`.
    - id: tool-subagent-dsh-sdk
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: dsh-sdk
        toolName: subagent_dsh
        enableRunInBackground: true
        maxDepth: provider-managed

    # Persistent terminal on POSIX hosts; Windows has no shipped terminal
    # backend (bash-gated rows stay off, matching the base shell rows).
    - id: pty
      name: '@deepseek-ai/dsh-terminal'

    - id: terminal-bash
      name: '@deepseek-ai/dsh-terminal-bash'
      disabled: !!js process.platform === 'win32'
      config:
        timeoutMs: 300000

    - id: tool-terminal
      name: '@deepseek-ai/dsh-tool-terminal'
      disabled: !!js process.platform === 'win32'
